<style>
  html, body { margin:0; height:100%; background:#0b1220; color:#e2e8f0; font:13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #map { position:absolute; inset:0 0 64px 0; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:64px; background:#0f172a; border-top:1px solid #1e293b; display:flex; align-items:center; gap:10px; padding:0 12px; box-sizing:border-box; flex-wrap:wrap; }
  #bar button, #bar select { background:#1e293b; color:#e2e8f0; border:1px solid #334155; border-radius:6px; padding:5px 10px; font-size:13px; cursor:pointer; }
  #bar button.active { background:#2e7dff; border-color:#2e7dff; }

<body>
<div id="map"></div>
<div id="badge"><b>IR context preview</b> — near-global 8 km infrared, one image per 3 h.<br>

  <span id="range"></span></div>
<canvas id="cbar" width="1" height="256"></canvas>
<div id="cbar-lbl"><span>170 K</span><span>205 K</span><span>240 K</span><span>275 K</span><span>310 K</span></div>
<div id="bar">
  <button id="play" title="Play / pause">&#9654;</button>
  <button onclick="step(-1)" title="Previous frame">&#9664;</button>
  <button onclick="step(1)" title="Next frame">&#9654;</button>
  <input id="slider" type="range" min="0" max="0" value="0">
  <span id="dt">—</span>
  <select id="speed" title="Playback speed"><option value="1200">0.5x</option><option value="600" selected>1x</option><option value="300">2x</option></select>
  <select id="opacity" title="Opacity"><option value="1">100%</option><option value="0.8">80%</option><option value="0.6">60%</option></select>
  <span id="status"></span>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

7,174,255,46,161,178,255,50,164,181,255,54,168,184,255,58,171,188,255,62,175,191,255,66,178,194,255,72,182,197,255,80,185,200,255,88,188,203,255,96,192,205,255,104,195,208,255,112,198,211,255,119,201,213,255,127,205,216,255,135,208,218,255,142,210,220,255,146,211,221,255,150,211,221,255,154,212,222,255,158,212,222,255,163,212,222,255,167,213,223,255,171,213,223,255,175,214,224,255,179,214,224,255,184,215,225,255,188,215,225,255,192,215,225,255,196,216,226,255,200,216,226,255,205,217,227,255,209,217,227,255,213,218,228,255,215,217,227,255,213,215,225,255,211,213,223,255,210,211,222,255,208,209,220,255,206,207,218,255,204,205,216,255,202,203,214,255,200,201,212,255,198,199,210,255,196,196,208,255,194,194,206,255,192,192,204,255,190,190,202,255,188,188,200,255,186,186,198,255,184,184,196,255,182,182,194,255,180,180,192,255,176,176,188,255,173,173,185,255,170,170,182,255,166,166,178,255,163,163,175,255,160,160,172,255,156,156,168,255,153,153,165,255,150,150,162,255,147,147,159,255,143,143,155,255,140,140,152,255,137,137,149,255,133,133,145,255,130,130,142,255,127,127,139,255,123,123,135,255,120,120,132,255,117,117,129,255,115,115,127,255,112,112,124,255,109,109,121,255,106,106,118,255,104,104,116,255,101,101,113,255,98,98,110,255,95,95,107,255,92,92,104,255,90,90,102,255,87,87,99,255,84,84,96,255,81,81,93,255,79,79,91,255,76,76,88,255,73,73,85,255,70,70,82,255,68,68,80,255,67,67,78,255,65,65,76,255,63,63,75,255,61,61,73,255,59,59,71,255,57,57,69,255,55,55,67,255,53,53,65,255,51,51,63,255,50,50,61,255,48,48,59,255,46,46,57,255,44,44,55,255,42,42,53,255,40,40,51,255,38,38,49,255,36,36,47,255,35,35,45,255,33,33,43,255,31,31,41,255,29,29,40,255,27,27,38,255,25,25,36,255,23,23,34,255,21,21,32,255,20,20,30,255,18,18,28,255,16,16,26,255,14,14,24,255,12,12,22,255]);   // the site's claude-ir colormap, index 0 = transparent
  var lut = LUT;
  var center = [parseFloat(q.get('lon') || '-60'), parseFloat(q.get('lat') || '20')];
  var zoom = parseFloat(q.get('zoom') || '3');

  // colorbar
  (function () { var c = document.getElementById('cbar').getContext('2d'); var im = c.createImageData(1, 256);
    for (var i = 0; i < 256; i++) { var v = 255 - i, li = v * 4; im.data[i*4] = lut[li]; im.data[i*4+1] = lut[li+1]; im.data[i*4+2] = lut[li+2]; im.data[i*4+3] = v ? 255 : 0; }
    c.putImageData(im, 0, 0); })();

  var map = new maplibregl.Map({
    container: 'map', center: center, zoom: zoom, minZoom: 1, maxZoom: 7, attributionControl: true,
    style: { version: 8, sources: {
        carto: { type: 'raster', tiles: ['https://a.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png', 'https://b.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png'], tileSize: 256, attribution: '&copy; CARTO &middot; MergIR (NASA GES DISC) &middot; GridSat-B1 (NOAA NCEI)' },
        labels: { type: 'raster', tiles: ['https://a.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}.png'], tileSize: 256 } },
      layers: [ { id: 'carto', type: 'raster', source: 'carto' } ] }
  });
  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  var frames = [], bounds = null, idx = 0, playing = false, timer = null, opacity = 1;
  var decoded = {}, decodedOrder = [], DEC_MAX = 30;    // ts -> {idx, rows, cols}
  var rendered = {}, renderedOrder = [], REN_MAX = 30;  // ts -> object URL (colormapped, warped PNG)
  var reqSeq = 0;
  var canvas = document.createElement('canvas');
  var status = document.getElementById('status'), dtEl = document.getElementById('dt'), slider = document.getElementById('slider');

  function fmt(ts) { return ts.slice(0,4) + '-' + ts.slice(4,6) + '-' + ts.slice(6,8) + ' ' + ts.slice(8,10) + ':00 UTC'; }
  function lru(store, order, key, val, max) { store[key] = val; order.push(key); while (order.length > max) { var k = order.shift(); if (k !== key) { if (store[k] && store[k].url) URL.revokeObjectURL(store[k].url); delete store[k]; } } }

  function decode(ts) {
    if (decoded[ts]) return Promise.resolve(decoded[ts]);
    if (decoded[ts + ':p']) return decoded[ts + ':p'];
    var year = ts.slice(0, 4);
    var p = new Promise(function (res, rej) {
      var img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = function () {
        var cols = img.naturalWidth, rows = img.naturalHeight;
        var c = document.createElement('canvas'); c.width = cols; c.height = rows;
        var g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
        var px = g.getImageData(0, 0, cols, rows).data, out = new Uint8Array(cols * rows);
        for (var k = 0, n = cols * rows; k < n; k++) out[k] = px[k*4+3] < 128 ? 0 : (px[k*4] || 1);
        var rec = { idx: out, rows: rows, cols: cols }; delete decoded[ts + ':p']; lru(decoded, decodedOrder, ts, rec, DEC_MAX); res(rec);
      };
      img.onerror = function () { delete decoded[ts + ':p']; rej(new Error('load failed ' + ts)); };

    });
    decoded[ts + ':p'] = p; return p;
  }

  // Equirectangular -> Web Mercator row remap + colormap (same as the archive frames)
  function render(ts, rec) {
    if (rendered[ts]) return Promise.resolve(rendered[ts].url);
    var rows = rec.rows, cols = rec.cols; canvas.width = cols; canvas.height = rows;
    var g = canvas.getContext('2d'), im = g.createImageData(cols, rows), px = im.data;
    var mY = function (d) { var r = d * Math.PI / 180; return Math.log(Math.tan(Math.PI / 4 + r / 2)); };
    var mN = mY(bounds.north), mS = mY(bounds.south), mR = mN - mS;
    for (var r = 0; r < rows; r++) {
      var lat = (2 * Math.atan(Math.exp(mN - (r / (rows - 1)) * mR)) - Math.PI / 2) * 180 / Math.PI;

      for (var c = 0; c < cols; c++) { var v = rec.idx[so + c], pi = po + c * 4;

    if (!frames.length) return; idx = (i + frames.length) % frames.length; var ts = frames[idx]; var seq = ++reqSeq;
    slider.value = idx; dtEl.textContent = fmt(ts); status.textContent = rendered[ts] ? '' : 'loading…';
    decode(ts).then(function (rec) { return render(ts, rec); }).then(function (url) {
      if (seq !== reqSeq) return;
      var src = map.getSource('ctx');
      if (!src) { map.addSource('ctx', { type: 'image', url: url, coordinates: coords() });

      else src.updateImage({ url: url, coordinates: coords() });

  document.getElementById('play').onclick = function () { if (playing) { pause(); return; } playing = true; this.classList.add('active'); tick(); };
  slider.oninput = function () { pause(); show(parseInt(this.value, 10)); };
  document.getElementById('opacity').onchange = function () { opacity = parseFloat(this.value); if (map.getLayer('ctx')) map.setPaintProperty('ctx', 'raster-opacity', opacity); };

  var years = []; for (var y = parseInt(START.slice(0,4), 10); y <= parseInt(END.slice(0,4), 10); y++) years.push(y);
  Promise.all(years.map(function (y) { return fetch(CTX + '/' + y + '/index.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }))
    .then(function (docs) {
      docs.forEach(function (d) { if (!d) return; bounds = bounds || d.bounds; (d.ts || []).forEach(function (t) { if (t >= START && t <= END) frames.push(t); }); });

      document.getElementById('range').textContent = frames.length ? (frames.length + ' frames, ' + fmt(frames[0]) + ' → ' + fmt(frames[frames.length - 1]) + '. Space = play, arrows = step.') : 'No frames built for this range yet.';

    });
})();
</script>
