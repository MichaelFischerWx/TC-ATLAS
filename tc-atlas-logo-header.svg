<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" height="40" width="280">
  <!-- Header lockup: two-armed cyclone + wordmark in UM palette. -->

  <g transform="translate(20, 20)" fill="none" stroke="#005030" stroke-linecap="round">
    <circle cx="0" cy="0" r="14" stroke-width="1.0" opacity="0.30"/>
    <ellipse cx="0" cy="0" rx="7" ry="14" stroke-width="0.7" opacity="0.20"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke-width="0.6" opacity="0.20"/>
  </g>

  <g transform="translate(20, 20)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8,-11
             C 13,-9   15,-3   14,2
             C 13,8   7,11    2,10.5
             C -2,10  -4,8.5  -5,6.5"
          stroke="#005030" stroke-width="4" opacity="0.95"/>

    <path d="M -8,11
             C -13,9   -15,3   -14,-2
             C -13,-8  -7,-11  -2,-10.5
             C 2,-10   4,-8.5  5,-6.5"
          stroke="#F47321" stroke-width="4" opacity="0.95"/>

    <circle cx="0" cy="0" r="1.6" fill="#0d1318"/>
  </g>

  <text x="44" y="27" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="#0f1623">TC-ATLAS</text>
</svg>
