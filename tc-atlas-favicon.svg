<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Favicon — UM palette, two-armed cyclone (mirrors tc-atlas-icon.svg). -->

  <rect width="32" height="32" rx="6" fill="#ffffff"/>

  <g transform="translate(16, 16)" fill="none" stroke="#005030" stroke-linecap="round">
    <circle cx="0" cy="0" r="12" stroke-width="0.9" opacity="0.30"/>
    <ellipse cx="0" cy="0" rx="6" ry="12" stroke-width="0.6" opacity="0.20"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke-width="0.5" opacity="0.20"/>
  </g>

  <g transform="translate(16, 16)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Arm A — UM green -->
    <path d="M 7,-9.5
             C 11,-7.5  13,-3   12,2
             C 11,7    6.5,10   1.5,9.5
             C -1.5,9  -3.5,7.5 -4.5,5.5"
          stroke="#005030" stroke-width="3.5" opacity="0.95"/>

    <!-- Arm B — UM orange -->
    <path d="M -7,9.5
             C -11,7.5  -13,3   -12,-2
             C -11,-7  -6.5,-10 -1.5,-9.5
             C 1.5,-9   3.5,-7.5 4.5,-5.5"
          stroke="#F47321" stroke-width="3.5" opacity="0.95"/>

    <circle cx="0" cy="0" r="1.4" fill="#0d1318"/>
  </g>
</svg>
