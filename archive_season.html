<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Season Replay — TC-ATLAS</title>
<link rel="icon" href="tc-atlas-favicon-32.png">
<link href="assets/vendor/maplibre/maplibre-gl.css?v=4.7.1" rel="stylesheet">
<script src="theme.js?v=20260908a"></script>
<style>
  /* Site palette (mirrors tc_radar_styles.css); theme.js sets data-theme="dark" from the user's site-wide choice */
  :root { --bg:#ffffff; --surface:#f7f8fa; --surface-raised:#ffffff; --border:rgba(15,22,35,.08); --text:#0f1623; --muted:#5b6573; --um-green:#005030; --um-orange:#F47321; --panel:rgba(255,255,255,.88); --ctl:#eef1f5; --ctl-border:rgba(15,22,35,.12); }
  [data-theme="dark"] { --bg:#0a0e14; --surface:#111722; --surface-raised:#161d2a; --border:rgba(255,255,255,.08); --text:#e6ebf2; --muted:#8993a4; --um-green:#2e9c6a; --panel:rgba(17,23,34,.88); --ctl:#1c2432; --ctl-border:rgba(255,255,255,.12); }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
  #map { position:absolute; inset:0; }
  .hud { position:absolute; z-index:5; background:var(--panel); border:1px solid var(--border); border-radius:10px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:0 6px 24px rgba(0,0,0,.3); }
  #top { top:10px; left:10px; display:flex; align-items:center; gap:8px; padding:6px 10px; flex-wrap:wrap; max-width:calc(100% - 20px); }
  #top b { font-size:14px; }
  select, button { background:var(--ctl); color:var(--text); border:1px solid var(--ctl-border); border-radius:6px; padding:4px 9px; font-size:12px; font-weight:600; cursor:pointer; }
  button.active { background:var(--um-green); border-color:var(--um-green); color:#fff; }
  #follow { display:none; background:var(--um-orange); border-color:var(--um-orange); color:#fff; }
  #bar { left:10px; right:10px; bottom:10px; display:flex; align-items:center; gap:8px; padding:6px 10px; }
  #strip { position:relative; flex:1; height:30px; min-width:120px; }
  #strip canvas { position:absolute; inset:0; width:100%; height:100%; border-radius:4px; }
  #slider { position:absolute; inset:0; width:100%; height:100%; margin:0; -webkit-appearance:none; appearance:none; background:transparent; }
  #slider::-webkit-slider-runnable-track { background:transparent; height:100%; }
  #slider::-webkit-slider-thumb { -webkit-appearance:none; width:3px; height:30px; background:var(--text); box-shadow:0 0 0 1px var(--surface-raised); border-radius:2px; cursor:ew-resize; }
  #slider::-moz-range-thumb { width:3px; height:30px; background:var(--text); border:0; border-radius:2px; }
  #dt { font-variant-numeric:tabular-nums; font-weight:600; min-width:150px; text-align:right; cursor:pointer; border-bottom:1px dashed var(--muted); padding-bottom:1px; }
  #dt:hover { color:var(--um-green); border-bottom-color:var(--um-green); }
  #jump { position:absolute; right:10px; bottom:calc(100% + 8px); display:none; align-items:center; gap:6px; padding:8px 10px; }
  #jump input[type=date] { background:var(--ctl); color:var(--text); border:1px solid var(--ctl-border); border-radius:6px; padding:3px 6px; font-size:12px; color-scheme:light dark; }
  #jump label { font-size:11px; color:var(--muted); }
  #legend { right:10px; top:10px; padding:8px 10px; font-size:11px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  #legend .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #legend i { display:inline-block; width:10px; height:10px; border-radius:50%; border:1px solid #fff; }
  #cbar { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:30px; height:170px; padding:6px 0; display:flex; flex-direction:column; align-items:center; z-index:5; }
  #cbar canvas { display:block; width:12px; height:126px; min-height:0; border-radius:2px; }
  #cbar span { font-size:9px; color:var(--muted); }
  #status { color:var(--muted); font-size:11px; }
  #tb { position:absolute; z-index:6; pointer-events:none; display:none; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:3px 7px; font-size:11px; color:var(--text); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #tb b { font-size:12px; }
  #tb small { color:var(--muted); margin-left:5px; }
  .lbl { pointer-events:auto; cursor:pointer; background:rgba(15,23,42,.78); border:1px solid rgba(255,255,255,.18); border-radius:6px; padding:2px 6px; font-size:11px; white-space:nowrap; color:#fff; }
  .lbl.follow { border-color:var(--um-orange); box-shadow:0 0 0 1px var(--um-orange); }
  .lbl .open { margin-left:6px; color:#cbd5e1; opacity:.8; }
  .lbl .open:hover { color:#fff; opacity:1; }


  .tick { position:absolute; left:14px; top:-14px; width:14px; height:14px; border-top:1.5px solid rgba(255,255,255,.7); border-right:0; transform:skewX(-45deg); transform-origin:left bottom; pointer-events:none; }
  .lbl b { font-weight:700; letter-spacing:.02em; }
  .lbl .g { color:#7dd3fc; margin-left:4px; }
  .lbl .b { color:#fde68a; margin-left:4px; }
  @media (max-width:768px) { #legend { display:none; } #dt { min-width:0; font-size:11px; } #top b { font-size:13px; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="top" class="hud">
  <b>Season Replay</b>
  <select id="year" title="Season"></select>
  <select id="basin" title="Map focus">
    <option value="AL">Atlantic</option><option value="EP">E. Pacific</option><option value="WP">W. Pacific</option>
    <option value="NI">N. Indian</option><option value="SI">S. Indian</option><option value="SP">S. Pacific</option><option value="GL">Global</option>
  </select>
  <button id="src" title="Intensity source shown in labels and marker colours">Best track</button>
  <button id="markers" class="active" title="Show storm circles and labels">Markers</button>
  <button id="trails" class="active" title="Show 48-h track trails">Trails</button>
  <button id="secbtn" class="active" title="When zoomed in, overlay the nearest storm's exact 4 km sector frame on the 8 km context">4 km sector</button>
  <button id="follow" title="Release the storm lock"></button>
  <span id="status"></span>
  <span id="sec" style="color:#7dd3fc;font-size:11px"></span>
</div>
<div id="legend" class="hud">
  <div class="row"><i style="background:#60a5fa"></i>TD/TS &lt;64 kt <i style="background:#fbbf24;margin-left:8px"></i>Cat 1-2 <i style="background:#f87171;margin-left:8px"></i>Cat 3 <i style="background:#ef4444;margin-left:8px"></i>Cat 4 <i style="background:#c084fc;margin-left:8px"></i>Cat 5</div>
  <div class="row"><span style="color:#fde68a">kt</span> best track &nbsp;<span style="color:#7dd3fc">G</span> GHOST reanalysis, where available</div>
  <div class="row">Dashed circle = 300 km radius locator (not a wind radius). Click a storm to lock the view on it.</div>
</div>
<div id="tb"></div>
<div id="cbar" class="hud"><span>310 K</span><canvas width="1" height="126"></canvas><span>170 K</span></div>
<div id="bar" class="hud">
  <button id="prev" title="Previous frame (left arrow)">&#9664;</button>
  <button id="play" title="Play / pause (space)">&#9654; Play</button>
  <button id="next" title="Next frame (right arrow)">&#9654;</button>
  <div id="strip"><canvas id="stripc"></canvas><input id="slider" type="range" min="0" max="0" value="0"></div>
  <span id="dt" title="Click to jump to a date">&mdash;</span>
  <div id="jump" class="hud">
    <label for="jdate">Jump to</label>
    <input type="date" id="jdate">
    <select id="jhour"><option>00</option><option>03</option><option>06</option><option>09</option><option value="12" selected>12</option><option>15</option><option>18</option><option>21</option></select>
    <label>UTC</label>
    <button id="jgo">Go</button>
  </div>
  <select id="speed" title="Speed"><option value="900">0.5x</option><option value="450" selected>1x</option><option value="220">2x</option><option value="110">4x</option></select>
</div>

  function jumpTo(ts) { var k = -1; for (var i = 0; i < frames.length; i++) { if (frames[i] >= ts) { k = i; break; } } if (k < 0) k = frames.length - 1; if (k >= 0) { pause(); show(k); } }
  dtEl.onclick = function () {
    if (!frames.length) return;
    var open = jump.style.display !== 'flex';
    if (open) { var ts = frames[idx]; jdate.min = year + '-01-01'; jdate.max = year + '-12-31'; jdate.value = ts.slice(0,4) + '-' + ts.slice(4,6) + '-' + ts.slice(6,8); jhour.value = String(Math.floor(parseInt(ts.slice(8,10), 10) / 3) * 3).padStart(2, '0'); }
    jump.style.display = open ? 'flex' : 'none'; if (open) jdate.focus();
  };
  $('jgo').onclick = function () { if (!jdate.value) return; jumpTo(jdate.value.replace(/-/g, '') + jhour.value); jump.style.display = 'none'; };
  jdate.onkeydown = function (e) { if (e.key === 'Enter') $('jgo').click(); if (e.key === 'Escape') jump.style.display = 'none'; };
  jhour.onchange = function () { if (jdate.value) jumpTo(jdate.value.replace(/-/g, '') + jhour.value); };
  document.addEventListener('click', function (e) { if (jump.style.display === 'flex' && !jump.contains(e.target) && e.target !== dtEl) jump.style.display = 'none'; });
  document.addEventListener('keydown', function (e) { if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return; if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); else if (e.key === ' ') { e.preventDefault(); $('play').click(); } });
  $('src').onclick = function () { useGhost = !useGhost; this.textContent = useGhost ? 'GHOST' : 'Best track'; this.classList.toggle('active', useGhost); if (frames.length) drawStorms(frames[idx]); drawStrip(); };
  $('trails').onclick = function () { trailsOn = !trailsOn; this.classList.toggle('active', trailsOn); if (frames.length) drawStorms(frames[idx]); };
  $('markers').onclick = function () { markersOn = !markersOn; this.classList.toggle('active', markersOn); if (frames.length) drawStorms(frames[idx]); };
  $('basin').value = basin; $('basin').onchange = function () { basin = this.value; map.flyTo({ center: VIEWS[basin].slice(0,2), zoom: VIEWS[basin][2] }); };

  function drawStrip() {
    var cv = $('stripc'), W = cv.parentNode.clientWidth, H = cv.parentNode.clientHeight; if (!W || !H || !frames.length) return;
    var dpr = devicePixelRatio || 1; cv.width = W * dpr; cv.height = H * dpr; var g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    var bw = (W - 6) / frames.length;
    for (var i = 0; i < frames.length; i++) { var ms = tsMs(frames[i]), vmax = null;
      for (var s = 0; s < storms.length; s++) { var st = stormState(storms[s], ms); if (!st) continue; var v = useGhost && st.gv != null ? st.gv : st.bv; if (v != null && (vmax == null || v > vmax)) vmax = v; }
      if (vmax == null) continue; var h = Math.max(2, vmax / 170 * (H - 4)); g.fillStyle = catColor(vmax); g.globalAlpha = 0.85; g.fillRect(3 + i * bw, H - 2 - h, Math.max(1, bw - 0.4), h); }
    g.globalAlpha = 1;
  }
  window.addEventListener('resize', function () { setTimeout(drawStrip, 120); });

  function loadSeason(y) {
    year = y; pause(); setFollow(null); frames = []; storms = []; Object.keys(markers).forEach(function (k) { markers[k].remove(); }); markers = {};
    if (mapReady) removeSector();
    status.textContent = 'loading season…'; dtEl.textContent = '—';
    history.replaceState(null, '', '?year=' + y + '&basin=' + basin + (useGhost ? '&src=ghost' : ''));
    Promise.all([
      fetch(CTX + '/' + y + '/index.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      fetch(SEA + '/' + y + '.json').then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
    ]).then(function (res) {
      var ctx = res[0], sea = res[1];
      if (ctx) { bounds = ctx.bounds || (y < 2000 ? { south: -70.035, north: 69.965, west: -180.035, east: 179.975 } : { south: -60, north: 60, west: -180, east: 180 }); frames = (ctx.ts || []).slice().sort(); }
      storms = sea ? sea.storms : [];
      slider.max = Math.max(0, frames.length - 1);
      var ng = storms.filter(function (s) { return s.gv; }).length;
      status.textContent = frames.length ? (frames.length + ' frames · ' + storms.length + ' storms' + (ng ? ' · GHOST for ' + ng : '')) : 'No imagery built for ' + y + ' yet' + (storms.length ? ' (' + storms.length + ' storms in the index)' : '');
      $('src').style.display = ng ? '' : 'none';
      drawStrip();
      if (frames.length) {
        // ?t=YYYYMMDDHH jumps straight to a time; otherwise start at the first frame with an active storm
        var want = q.get('t'), first = -1;
        if (want && /^\d{10}$/.test(want)) { for (var w = 0; w < frames.length; w++) { if (frames[w] >= want) { first = w; break; } } }
        if (first < 0) { first = 0; for (var i = 0; i < frames.length; i++) { var ms = tsMs(frames[i]); if (storms.some(function (s) { return stormState(s, ms); })) { first = i; break; } } }
        show(first);
      }
    });
  }
  var ysel = $('year'); for (var yy = 2026; yy >= 1980; yy--) { var o = document.createElement('option'); o.value = yy; o.textContent = yy; ysel.appendChild(o); }
  ysel.value = year; ysel.onchange = function () { loadSeason(parseInt(this.value, 10)); };
  loadSeason(year);
})();
</script>
